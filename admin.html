<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#050b08"><link rel="icon" href="/assets/monaco.png"><title>Administración | MONACO 98.7 FM</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap');*{box-sizing:border-box}body{margin:0;background:#07100b;color:#f5f7f5;font-family:Inter,Arial}.wrap{max-width:1000px;margin:35px auto;padding:20px}.top{display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-size:22px;font-weight:800}.brand span{color:#20c96a}.panel{background:#0d1b12;border:1px solid #21442d;border-radius:12px;padding:22px;margin:20px 0}.login{max-width:430px;margin:12vh auto}input,textarea{width:100%;padding:12px;border-radius:7px;border:1px solid #36513e;background:#07100b;color:white;margin:7px 0 14px;font:inherit}textarea{min-height:100px;resize:vertical}label{font-size:13px;font-weight:700;color:#cbd7ce}button{border:0;border-radius:7px;padding:11px 16px;background:#159b50;color:white;font-weight:800;cursor:pointer;margin:4px}button.secondary{background:#26362b}button.danger{background:#a52d2d}.tabs{display:flex;gap:8px;flex-wrap:wrap}.item{display:flex;gap:14px;align-items:center;border-top:1px solid #263b2c;padding:14px 0}.item img{width:90px;height:70px;object-fit:cover;border-radius:6px}.item .grow{flex:1}.muted{color:#9eafa3;font-size:13px}.preview{max-width:220px;max-height:150px;object-fit:contain;display:block;margin:8px 0;border-radius:7px}.hidden{display:none!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.item{align-items:flex-start}.item img{width:72px}}
</style></head><body><div class="wrap"><div class="top"><div class="brand">MONACO <span>98.7 FM</span> · ADMIN</div><a href="/" style="color:#20c96a">← Ver sitio público</a></div>
<section id="login" class="panel login"><h2>Ingresar al administrador</h2><label>Contraseña</label><input id="password" type="password" placeholder="Contraseña de administrador"><button id="loginBtn">INGRESAR</button><p id="loginMsg" class="muted"></p></section>
<div id="app" class="hidden"><div class="panel"><div class="top"><div><h2>Panel de administración</h2><p class="muted">Administrá noticias y programación de MONACO 98.7 FM.</p></div><button class="secondary" id="logout">Cerrar sesión</button></div><div class="tabs"><button data-tab="news">NOTICIAS</button><button data-tab="programs">PROGRAMACIÓN</button></div></div>
<section id="newsPanel" class="panel"><h2 id="newsHeading">Agregar noticia</h2><input type="hidden" id="newsId"><label>Título</label><input id="newsTitle" maxlength="140" placeholder="Título de la noticia"><label>Detalles / descripción</label><textarea id="newsDetails" placeholder="Escribí el contenido de la noticia"></textarea><label>Imagen</label><input id="newsImage" type="file" accept="image/*"><img id="newsPreview" class="preview hidden" alt="Vista previa"><button id="saveNews">GUARDAR NOTICIA</button><button class="secondary" id="cancelNews">LIMPIAR</button><h3>Noticias cargadas</h3><div id="newsList"></div></section>
<section id="programPanel" class="panel hidden"><h2 id="programHeading">Agregar programa</h2><input type="hidden" id="programId"><div class="grid"><div><label>Título del programa</label><input id="programTitle" maxlength="100" placeholder="Nombre del programa"></div><div><label>Horario</label><input id="programHour" placeholder="Ej. 08:00 a 10:00"></div></div><label>Imagen</label><input id="programImage" type="file" accept="image/*"><img id="programPreview" class="preview hidden" alt="Vista previa"><button id="saveProgram">GUARDAR PROGRAMA</button><button class="secondary" id="cancelProgram">LIMPIAR</button><h3>Programas cargados</h3><div id="programList"></div></section></div></div>
<script>
let data={news:[],programs:[]},newsImageData='',programImageData='';
const $=id=>document.getElementById(id);
async function api(path,opts={}){let r=await fetch('/api/'+path,{...opts,headers:{'Content-Type':'application/json',...(opts.headers||{})}});let d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||'Error de servidor');return d}
async function enter(){try{await api('login',{method:'POST',body:JSON.stringify({password:$('password').value})});$('login').classList.add('hidden');$('app').classList.remove('hidden');await load()}catch(e){$('loginMsg').textContent=e.message}}
$('loginBtn').onclick=enter;$('password').addEventListener('keydown',e=>{if(e.key==='Enter')enter()});
async function load(){data=await api('data');render()}
async function save(){await api('data',{method:'POST',body:JSON.stringify(data)});render()}
$('logout').onclick=async()=>{await api('logout',{method:'POST'});$('app').classList.add('hidden');$('login').classList.remove('hidden');$('password').value=''};
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{let n=b.dataset.tab==='news';$('newsPanel').classList.toggle('hidden',!n);$('programPanel').classList.toggle('hidden',n)});
function fileToData(file){return new Promise((res,rej)=>{if(file.size>3*1024*1024)return rej(Error('La imagen debe pesar menos de 3 MB'));let r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
$('newsImage').onchange=async e=>{try{newsImageData=await fileToData(e.target.files[0]);$('newsPreview').src=newsImageData;$('newsPreview').classList.remove('hidden')}catch(x){alert(x.message)}};
$('programImage').onchange=async e=>{try{programImageData=await fileToData(e.target.files[0]);$('programPreview').src=programImageData;$('programPreview').classList.remove('hidden')}catch(x){alert(x.message)}};
function resetNews(){['newsId','newsTitle','newsDetails'].forEach(x=>$(x).value='');$('newsImage').value='';newsImageData='';$('newsPreview').classList.add('hidden');$('newsHeading').textContent='Agregar noticia'}
function resetProgram(){['programId','programTitle','programHour'].forEach(x=>$(x).value='');$('programImage').value='';programImageData='';$('programPreview').classList.add('hidden');$('programHeading').textContent='Agregar programa'}
$('cancelNews').onclick=resetNews;$('cancelProgram').onclick=resetProgram;
$('saveNews').onclick=async()=>{let title=$('newsTitle').value.trim(),details=$('newsDetails').value.trim();if(!title||!details)return alert('Completá el título y los detalles');let id=$('newsId').value;let old=data.news.find(x=>x.id===id);let item={id:id||crypto.randomUUID(),title,details,image:newsImageData||old?.image||''};if(old)data.news=data.news.map(x=>x.id===id?item:x);else data.news.push(item);try{await save();resetNews()}catch(e){alert(e.message)}};
$('saveProgram').onclick=async()=>{let title=$('programTitle').value.trim(),hour=$('programHour').value.trim();if(!title||!hour)return alert('Completá el título y el horario');let id=$('programId').value,old=data.programs.find(x=>x.id===id);let item={id:id||crypto.randomUUID(),title,hour,image:programImageData||old?.image||''};if(old)data.programs=data.programs.map(x=>x.id===id?item:x);else data.programs.push(item);try{await save();resetProgram()}catch(e){alert(e.message)}};
function render(){ $('newsList').innerHTML='';data.news.forEach(n=>{let d=document.createElement('div');d.className='item';let im=document.createElement('img');im.src=n.image||'/assets/monaco.png';let g=document.createElement('div');g.className='grow';let b=document.createElement('b');b.textContent=n.title;let p=document.createElement('p');p.className='muted';p.textContent=n.details;g.append(b,p);let edit=document.createElement('button');edit.textContent='EDITAR';edit.onclick=()=>{ $('newsId').value=n.id;$('newsTitle').value=n.title;$('newsDetails').value=n.details;newsImageData='';$('newsPreview').src=n.image;$('newsPreview').classList.toggle('hidden',!n.image);$('newsHeading').textContent='Editar noticia';window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.className='danger';del.textContent='ELIMINAR';del.onclick=async()=>{if(confirm('¿Eliminar esta noticia?')){data.news=data.news.filter(x=>x.id!==n.id);await save()}};d.append(im,g,edit,del);$('newsList').append(d)});
$('programList').innerHTML='';data.programs.forEach(p=>{let d=document.createElement('div');d.className='item';let im=document.createElement('img');im.src=p.image||'/assets/monaco.png';let g=document.createElement('div');g.className='grow';let b=document.createElement('b');b.textContent=p.title;let t=document.createElement('p');t.className='muted';t.textContent=p.hour;g.append(b,t);let edit=document.createElement('button');edit.textContent='EDITAR';edit.onclick=()=>{$('programId').value=p.id;$('programTitle').value=p.title;$('programHour').value=p.hour;programImageData='';$('programPreview').src=p.image;$('programPreview').classList.toggle('hidden',!p.image);$('programHeading').textContent='Editar programa';window.scrollTo({top:0,behavior:'smooth'})};let del=document.createElement('button');del.className='danger';del.textContent='ELIMINAR';del.onclick=async()=>{if(confirm('¿Eliminar este programa?')){data.programs=data.programs.filter(x=>x.id!==p.id);await save()}};d.append(im,g,edit,del);$('programList').append(d)})}
api('session').then(x=>{if(x.authenticated){$('login').classList.add('hidden');$('app').classList.remove('hidden');load()}}).catch(()=>{});
</script></body></html>
